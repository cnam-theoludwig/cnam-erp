services:
  cnam-erp-web:
    image: "ghcr.io/theoludwig/cnam-erp-web:${VERSION-0.0.0-develop}"
    # image: "cnam-erp-web:${VERSION-0.0.0-develop}"
    # pull_policy: "build"
    # build:
    #   context: "./"
    #   dockerfile: "./apps/web/Dockerfile"
    restart: "unless-stopped"
    environment:
      PORT: ${WEB_PORT-4000}
      VERSION: ${VERSION-0.0.0-develop}
    env_file: "./apps/web/.env"
    ports:
      - "${WEB_PORT-4000}:${WEB_PORT-4000}"
    logging:
      driver: "json-file"
      options:
        max-size: "10M"
        max-file: "3"
    networks:
      - "frontend"
      - "backend"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:'' + (process.env.PORT || 4000) + ''/api/health'').then(r => { if (!r.ok) { process.exit(1) } }).catch(() => { process.exit(1) })"',
        ]
      interval: "10s"
      timeout: "5s"
      retries: 3
      start_period: "30s"

  cnam-erp-api:
    image: "ghcr.io/theoludwig/cnam-erp-api:${VERSION-0.0.0-develop}"
    # image: "cnam-erp-api:${VERSION-0.0.0-develop}"
    # pull_policy: "build"
    # build:
    #   context: "./"
    #   dockerfile: "./apps/api/Dockerfile"
    restart: "unless-stopped"
    environment:
      PORT: ${API_PORT-4500}
      VERSION: ${VERSION-0.0.0-develop}
    env_file: "./apps/api/.env"
    ports:
      - "${API_PORT-4500}:${API_PORT-4500}"
    logging:
      driver: "json-file"
      options:
        max-size: "10M"
        max-file: "3"
    networks:
      - "frontend"
      - "backend"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:'' + (process.env.PORT || 4500) + ''/health'').then(r => { if (!r.ok) { process.exit(1) } }).catch(() => { process.exit(1) })"',
        ]
      interval: "10s"
      timeout: "5s"
      retries: 3
      start_period: "30s"

  cnam-erp-database:
    image: "docker.io/postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941"
    restart: "unless-stopped"
    logging:
      driver: "json-file"
      options:
        max-size: "10M"
        max-file: "3"
    environment:
      TZ: ${TZ-Europe/Paris}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    networks:
      - "backend"
    volumes:
      - "cnam-erp-postgres-data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "30s"

  cnam-erp-redis:
    image: "docker.io/redis:8.10.2@sha256:d5ac52db24d4e70566fe9944f22cf5bdc2bc739b05c0f426335161ea6c23f3b3"
    restart: "unless-stopped"
    logging:
      driver: "json-file"
      options:
        max-size: "10M"
        max-file: "3"
    environment:
      TZ: ${TZ-Europe/Paris}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: "redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes"
    networks:
      - "backend"
    volumes:
      - "cnam-erp-redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "2s"

networks:
  frontend:
    name: "cnam-erp-frontend"
    driver: "bridge"
  backend:
    name: "cnam-erp-backend"
    driver: "bridge"
    internal: true

volumes:
  cnam-erp-postgres-data:
  cnam-erp-redis-data:
