name: "ci"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    timeout-minutes: 45
    runs-on: "ubuntu-latest"
    env:
      CI: "1"
      TZ: "Europe/Paris"
      DO_NOT_TRACK: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Setup Bun"
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6" # v2.2.0
        with:
          bun-version: "canary"
      - run: "bun --revision"

      - run: "cp .env.example .env && cp apps/api/.env.example apps/api/.env && cp apps/web/.env.example apps/web/.env"

      - run: "bun install --frozen-lockfile"
      - run: "bun run lint:fmt"
      - run: "bun run lint:turbo"
      - run: "bun run lint"
      - run: "bun run test"
      - run: "bun run build"
